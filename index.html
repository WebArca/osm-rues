<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Extracteur de rues OSM (sélection → CSV)</title>
  <style>
    :root { --bg:#0f172a; --muted:#f8fafc; --line:#e2e8f0; --brand:#0284c7; }
    html, body { height: 100%; margin: 0; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    #app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; }
    header { padding: .6rem 1rem; background: var(--bg); color: #fff; }
    header h1 { font-size: 1.05rem; margin: 0; }
    #toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .6rem 1rem; background: var(--muted); border-bottom: 1px solid var(--line); }
    #toolbar button, #toolbar select, #toolbar input { padding: .45rem .7rem; border-radius: .5rem; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-size: .95rem; }
    #toolbar button[disabled] { opacity: .55; cursor: not-allowed; }
    #toolbar button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    #toolbar .group { display: inline-flex; gap: .4rem; align-items: center; }
    #toolbar label { font-size: .9rem; color: #334155; }
    #map { width: 100%; height: 80vh; min-height: 520px; }
    .leaflet-container { background: #e5e7eb; }
    #log { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: .9rem; padding: .6rem 1rem; background: #f1f5f9; border-top: 1px solid var(--line); max-height: 28vh; overflow: auto; }
    #table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { border: 1px solid #e5e7eb; padding: .4rem .5rem; }
    th { background: #f8fafc; text-align: left; }
    .badge { display: inline-block; padding: .15rem .45rem; border-radius: .45rem; background: #eef2ff; color: #3730a3; font-size: .78rem; }
    .right { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
    .warn { color: #b45309; }
    .err  { color: #b91c1c; }
    .ok   { color: #065f46; }
  </style>
</head>
<body>
<noscript style="padding:1rem;color:#b91c1c;">Activez JavaScript pour afficher la carte.</noscript>
<div id="app">
  <header>
    <h1>Extracteur de rues OSM — dessinez ou utilisez la vue courante, exportez en CSV</h1>
  </header>

  <div id="toolbar">
    <div class="group">
      <button id="btn-clear">Effacer la sélection</button>
      <button id="btn-query-poly" class="primary">Rechercher (polygone)</button>
      <button id="btn-query-bbox">Rechercher (BBOX vue courante)</button>
    </div>

    <div class="group">
      <label for="types">Types de voies (regex) :</label>
      <input id="types" size="42"
             value="^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|pedestrian)$" />
    </div>

    <div class="group">
      <label>Serveur Overpass :</label>
      <select id="endpoint">
        <option value="https://overpass-api.de/api/interpreter">overpass-api.de</option>
        <option value="https://overpass.kumi.systems/api/interpreter">kumi.systems</option>
        <option value="https://overpass.openstreetmap.ru/cgi/interpreter">openstreetmap.ru</option>
      </select>
    </div>

    <div class="right">
      <span id="count-unique" class="badge" title="Rues uniques">0 nom unique</span>
      <span id="count-raw" class="badge" title="Segments (ways)">0 tronçon</span>
      <button id="btn-dl-unique" disabled>CSV (noms uniques)</button>
      <button id="btn-dl-raw" disabled>CSV (détails)</button>
    </div>
  </div>

  <div id="map"></div>

  <div id="log">
    <div><strong>Journal</strong> — Dessinez un polygone/rectangle OU utilisez le bouton BBOX (vue courante), puis lancez une recherche.</div>
    <div>Astuce : zoomez au plus près du quartier pour limiter le volume.</div>
    <div id="messages"></div>
    <div id="table-wrap"></div>
  </div>
</div>

<script>
/** Chargeurs multi-CDN (Leaflet + Leaflet.draw) **/
(function(){
  const logEl = document.getElementById('messages');
  function log(msg, cls){ const p=document.createElement('div'); if(cls)p.className=cls; p.textContent=msg; logEl && logEl.prepend(p); }

  function loadCSS(href){
    return new Promise((resolve,reject)=>{
      const l=document.createElement('link'); l.rel='stylesheet'; l.href=href;
      l.onload=()=>resolve(); l.onerror=()=>reject(new Error('CSS fail '+href));
      document.head.appendChild(l);
    });
  }
  function loadJS(src){
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script'); s.src=src; s.defer=true;
      s.onload=()=>resolve(); s.onerror=()=>reject(new Error('JS fail '+src));
      document.head.appendChild(s);
    });
  }
  async function loadFirstWorking(pairs, label){
    let lastErr=null;
    for (const p of pairs){
      try{
        log(`Chargement ${label} : ${new URL(p.js).host}`,'warn');
        await loadCSS(p.css);
        await loadJS(p.js);
        log(`${label} chargé : ${new URL(p.js).host}`,'ok');
        return true;
      }catch(e){ lastErr=e; log(`${label} échec : ${e.message}`,'err'); }
    }
    throw lastErr || new Error(`${label} introuvable`);
  }

  const leafletCDNs = [
    {css:"https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css", js:"https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"},
    {css:"https://unpkg.com/leaflet@1.9.4/dist/leaflet.css",            js:"https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"},
    {css:"https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css", js:"https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"},
  ];
  const drawCDNs = [
    {css:"https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.css", js:"https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"},
    {css:"https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css",            js:"https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"},
    {css:"https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css", js:"https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"},
  ];

  (async function boot(){
    try {
      await loadFirstWorking(leafletCDNs, 'Leaflet');
      await loadFirstWorking(drawCDNs, 'Leaflet.draw');
      initApp();
    } catch(e){
      log('Erreur critique de chargement : '+e.message,'err');
      alert('Erreur de chargement des bibliothèques :\\n'+e.message+'\\nEssayez un autre navigateur ou un autre réseau (certains CDN peuvent être bloqués).');
    }
  })();

  /** Application après chargement des libs **/
  function initApp(){
    const badgeUnique = id('count-unique');
    const badgeRaw    = id('count-raw');
    function setCounts(u, r) {
      badgeUnique.textContent = `${u} ${u>1?'noms uniques':'nom unique'}`;
      badgeRaw.textContent    = `${r} ${r>1?'tronçons':'tronçon'}`;
    }
    function id(x){return document.getElementById(x)}

    /** Export CSV robuste (BOM UTF-8 + fallback) **/
    function downloadCSV(text, filename){
      const csvText = "\uFEFF" + text; // BOM pour Excel + accents
      const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a);
      try { a.click(); } catch (e) { try { window.open(url, '_blank'); } catch(_) {} }
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    }

    function escapeHtml(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
    function log(msg, cls){ const p=document.createElement('div'); if(cls)p.className=cls; p.textContent=msg; logEl.prepend(p); }

    // --- Carte + fallback de tuiles
    const map = L.map('map');
    map.setView([44.657, -1.17], 14);
    const tileProviders = [
      {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',           attr:'&copy; OpenStreetMap contributors'},
      {url:'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',  attr:'&copy; OpenStreetMap, tiles: osmfr'},
      {url:'https://{s}.tile.openstreetmap.de/{z}/{x}/{y}.png',        attr:'&copy; OpenStreetMap, tiles: DE'},
    ];
    let tileIndex = 0;
    let tiles = L.tileLayer(tileProviders[tileIndex].url, {maxZoom:19, attribution: tileProviders[tileIndex].attr}).addTo(map);
    tiles.on('tileerror', ()=>{
      log('Erreur de tuiles. Bascule vers un autre serveur…', 'warn');
      if (tileIndex < tileProviders.length - 1){
        tileIndex++;
        map.removeLayer(tiles);
        tiles = L.tileLayer(tileProviders[tileIndex].url, {maxZoom:19, attribution: tileProviders[tileIndex].attr}).addTo(map);
      } else {
        log('Tous les serveurs de tuiles ont échoué.', 'err');
      }
    });

    map.whenReady(()=>{ log('Carte prête.','ok'); setTimeout(()=>map.invalidateSize(),100); });
    window.addEventListener('resize', ()=> setTimeout(()=>map.invalidateSize(),100));

    // --- Dessin
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);
    const drawControl = new L.Control.Draw({
      draw: { polyline:false, circle:false, marker:false, circlemarker:false,
        polygon:{allowIntersection:false, showArea:true, metric:true},
        rectangle:{showArea:true, metric:true}
      },
      edit: { featureGroup: drawnItems }
    });
    map.addControl(drawControl);
    map.on(L.Draw.Event.CREATED, e => { 
      drawnItems.addLayer(e.layer); 
      log('Forme ajoutée. Vous pouvez l’éditer avant recherche.'); 
    });

    id('btn-clear').addEventListener('click', ()=>{
      drawnItems.clearLayers(); setCounts(0,0);
      id('btn-dl-unique').disabled = id('btn-dl-raw').disabled = true;
      id('table-wrap').innerHTML=''; log('Sélection effacée.');
    });

    // --- Conversions géométriques
    function layerToPolyString(layer){
      // Gère Polygon et Rectangle (évite MultiPolygon)
      const latlngs = layer.getLatLngs();
      const ring = Array.isArray(latlngs[0]) ? latlngs[0] : latlngs;
      const coords = ring.map(ll=>[ll.lat, ll.lng]);
      // Ferme la bague si nécessaire
      const [lat0, lon0] = coords[0];
      const [latN, lonN] = coords[coords.length-1];
      if (lat0 !== latN || lon0 !== lonN) coords.push([lat0, lon0]);
      // Concatène "lat lon lat lon ..."
      return coords.map(([lat,lon])=>`${lat} ${lon}`).join(' ');
    }

    function getLastPolygonPoly(){
      // ✅ Utilise l’API publique → ordre d’insertion fiable
      const layers = drawnItems.getLayers();
      if (!layers.length) { 
        log("Aucune forme détectée. Dessinez un polygone/rectangle puis relancez.", "warn"); 
        return null; 
      }
      const layer = layers[layers.length - 1];
      if (typeof layer.getLatLngs !== "function") {
        log("La dernière couche n'est pas un polygone/rectangle.", "warn");
        return null;
      }
      const poly = layerToPolyString(layer);

      const pairs = poly.trim().split(/\s+/).length / 2;
      log(`Polygone prêt → ${pairs} points.`, "ok");
