<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Extracteur de rues OSM (sélection polygonale → CSV)</title>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j7kGICpbj1I1rCGqV1ZQ7r8M5x3G5xR0iR3S2Rc=" crossorigin=""></script>
  
  <!-- Leaflet.draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; }
    header { padding: .6rem 1rem; background: #0f172a; color: #fff; }
    header h1 { font-size: 1.1rem; margin: 0; }
    #map { width: 100%; height: 100%; min-height: 70vh; }
    #toolbar { display: flex; gap: .5rem; align-items: center; padding: .5rem 1rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    #toolbar button, #toolbar select { padding: .4rem .7rem; border-radius: .5rem; border: 1px solid #cbd5e1; background: white; cursor: pointer; }
    #toolbar button.primary { background: #0284c7; color: #fff; border-color: #0284c7; }
    #toolbar .right { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
    #log { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: .9rem; padding: .5rem 1rem; background: #f1f5f9; border-top: 1px solid #e2e8f0; max-height: 28vh; overflow: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { border: 1px solid #e5e7eb; padding: .4rem .5rem; }
    th { background: #f8fafc; text-align: left; }
    .badge { display: inline-block; padding: .15rem .4rem; border-radius: .4rem; background: #eef2ff; color: #3730a3; font-size: .75rem; }
  .leaflet-container { background: #e5e7eb; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>Extracteur de rues OSM — dessinez un polygone et exportez en CSV</h1>
  </header>

  <div id="toolbar">
    <button id="btn-clear">Effacer la sélection</button>
    <button id="btn-query" class="primary">Rechercher les rues (Overpass)</button>
    <button id="btn-download" disabled>Télécharger CSV</button>
    <span id="count" class="badge" title="Rues uniques">0 rue</span>
    <div class="right">
      <label for="endpoint">Serveur Overpass :</label>
      <select id="endpoint">
        <option value="https://overpass-api.de/api/interpreter">overpass-api.de</option>
        <option value="https://overpass.kumi.systems/api/interpreter">kumi.systems</option>
        <option value="https://overpass.openstreetmap.ru/cgi/interpreter">openstreetmap.ru</option>
      </select>
    </div>
  </div>

  <div id="map"></div>

  <div id="log">
    <div><strong>Journal</strong> — Dessinez avec l'outil polygone (ou rectangle), puis cliquez sur <em>Rechercher les rues</em>.</div>
    <div>Conseil : zoomez sur votre quartier pour limiter le volume de données.</div>
    <div id="messages"></div>
    <div id="table-wrap"></div>
  </div>
</div>

<script>
  // --- Helpers UI ---
  const logEl = document.getElementById('messages');
  function log(msg) {
    const p = document.createElement('div');
    p.textContent = msg;
    logEl.prepend(p);
  }

  function setCount(n) {
    const el = document.getElementById('count');
    el.textContent = n + (n > 1 ? ' rues' : ' rue');
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
  }

  // --- Leaflet Map ---
  const map = L.map('map');
  map.whenReady(() => {
    log('Carte prête.');
    setTimeout(() => map.invalidateSize(), 100);
  });
  window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 100));
  // Centre par défaut : Arcachon
  map.setView([44.657, -1.17], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);

  const drawControl = new L.Control.Draw({
    draw: {
      polyline: false,
      circle: false,
      marker: false,
      circlemarker: false,
      polygon: { allowIntersection: false, showArea: true, metric: true },
      rectangle: { showArea: true, metric: true }
    },
    edit: { featureGroup: drawnItems }
  });
  map.addControl(drawControl);

  map.on(L.Draw.Event.CREATED, function (e) {
    drawnItems.addLayer(e.layer);
    log('Forme ajoutée. Vous pouvez l\'éditer, ou cliquer sur "Rechercher les rues".');
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    drawnItems.clearLayers();
    setCount(0);
    document.getElementById('btn-download').disabled = true;
    document.getElementById('table-wrap').innerHTML = '';
    log('Sélection effacée.');
  });

  // --- Build Overpass poly string from Leaflet polygon/rectangle ---
  function layerToPolyString(layer) {
    // Accept Polygon or Rectangle (LatLngs may be nested)
    const latlngs = layer.getLatLngs();

    // Normalize possible MultiPolygon structure
    const ring = Array.isArray(latlngs[0]) ? latlngs[0] : latlngs;

    // Ensure closed ring (first == last)
    const coords = ring.map(ll => [ll.lat, ll.lng]);
    const first = coords[0];
    const last = coords[coords.length - 1];
    if (first[0] !== last[0] || first[1] !== last[1]) {
      coords.push(first);
    }

    // Flatten `lat lon` pairs separated by spaces
    return coords.map(([lat, lon]) => `${lat} ${lon}`).join(' ');
  }

  function getActivePolygonPolyString() {
    const layers = Object.values(drawnItems._layers);
    if (layers.length === 0) return null;
    // Use the last drawn layer
    const layer = layers[layers.length - 1];
    if (!('getLatLngs' in layer)) return null;
    return layerToPolyString(layer);
  }

  // --- Query Overpass ---
  async function queryOverpass(polyStr) {
    const endpoint = document.getElementById('endpoint').value;

    // Overpass QL: only named highways inside polygon
    const ql = `[
      out:json][timeout:60];
      way["highway"]["name"](poly:"${polyStr}");
      out tags;`;

    log('Requête envoyée à Overpass…');

    // Prefer POST (simple request, no preflight); if it fails, fall back to GET
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
        body: new URLSearchParams({ data: ql })
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`Overpass HTTP ${res.status}: ${text.slice(0,300)}…`);
      }
      return await res.json();
    } catch (e) {
      log('POST bloqué ou en échec, tentative en GET (fallback)…');
      // Fallback GET (peut échouer si l'URL est trop longue)
      const url = endpoint + '?' + new URLSearchParams({ data: ql + `
` }) + `&t=${Date.now()}`;
      const res2 = await fetch(url, { mode: 'cors' });
      if (!res2.ok) {
        const text2 = await res2.text();
        throw new Error(`Overpass (GET) ${res2.status}: ${text2.slice(0,300)}…`);
      }
      return await res2.json();
    }
  }

  // --- Render and CSV ---
  let lastRows = [];

  function renderTable(rows) {
    const wrap = document.getElementById('table-wrap');
    if (!rows.length) { wrap.innerHTML = '<p>Aucun résultat.</p>'; return; }
    const header = `<tr><th>name</th><th>highway</th><th>@id</th></tr>`;
    const trows = rows.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.highway||'')}</td><td>${escapeHtml(r.id)}</td></tr>`).join('');
    wrap.innerHTML = `<table>${header}${trows}</table>`;
  }

  function toCSV(rows) {
    const header = ['name','highway','@id'];
    const esc = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
    const lines = [header.join(',')];
    for (const r of rows) {
      lines.push([esc(r.name), esc(r.highway||''), esc(r.id)].join(','));
    }
    return lines.join('\n');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
  }

  // --- Button actions ---
  document.getElementById('btn-query').addEventListener('click', async () => {
    try {
      const poly = getActivePolygonPolyString();
      if (!poly) { alert('Dessinez d\'abord un polygone ou un rectangle.'); return; }

      setCount(0);
      document.getElementById('btn-download').disabled = true;
      document.getElementById('table-wrap').innerHTML = '';

      const json = await queryOverpass(poly);

      // Transform elements → rows
      const rowsRaw = (json.elements || [])
        .filter(el => el.type === 'way' && el.tags && el.tags.name)
        .map(el => ({ name: el.tags.name, highway: el.tags.highway || '', id: el.id }));

      // Deduplicate by name (keep first)
      const seen = new Set();
      const rows = [];
      for (const r of rowsRaw) {
        const key = r.name.toLowerCase().trim();
        if (!seen.has(key)) { seen.add(key); rows.push(r); }
      }

      rows.sort((a,b) => a.name.localeCompare(b.name, 'fr'));
      lastRows = rows;

      setCount(rows.length);
      renderTable(rows);
      document.getElementById('btn-download').disabled = rows.length === 0;

      log(`Résultats : ${rows.length} nom(s) de rue unique(s).`);
    } catch (err) {
      console.error(err);
      log('Erreur : ' + err.message);
      alert('Erreur Overpass :\n' + err.message + '\n\nConseils : réduisez la zone, réessayez un autre endpoint, ou patientez quelques minutes.');
    }
  });

  document.getElementById('btn-download').addEventListener('click', () => {
    if (!lastRows.length) return;
    const csv = toCSV(lastRows);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    downloadBlob(blob, 'rues_osm.csv');
  });
</script>
</body>
</html>
