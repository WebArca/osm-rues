<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Extracteur de rues OSM (sélection → CSV)</title>
  <style>
    :root { --bg:#0f172a; --muted:#f8fafc; --line:#e2e8f0; --brand:#0284c7; }
    html, body { height: 100%; margin: 0; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    #app { display: grid; grid-template-rows: auto auto minmax(220px, 1fr) minmax(165px, 30vh); height: 100vh; height: 100dvh; min-height: 0; }
    header { padding: .6rem 1rem; background: var(--bg); color: #fff; }
    header h1 { font-size: 1.05rem; margin: 0; }
    #toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .6rem 1rem; background: var(--muted); border-bottom: 1px solid var(--line); }
    #toolbar button, #toolbar select, #toolbar input { padding: .45rem .7rem; border-radius: .5rem; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-size: .95rem; }
    #toolbar button[disabled] { opacity: .55; cursor: not-allowed; }
    #toolbar button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    #toolbar .group { display: inline-flex; gap: .4rem; align-items: center; }
    #toolbar label { font-size: .9rem; color: #334155; }
    #map { width: 100%; height: 100%; min-height: 0; }
    .leaflet-container { background: #e5e7eb; }
    #log { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: .9rem; padding: .6rem 1rem; background: #f1f5f9; border-top: 1px solid var(--line); min-height: 0; overflow: auto; }
    #table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { border: 1px solid #e5e7eb; padding: .4rem .5rem; }
    th { background: #f8fafc; text-align: left; }
    .badge { display: inline-block; padding: .15rem .45rem; border-radius: .45rem; background: #eef2ff; color: #3730a3; font-size: .78rem; }
    .right { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
    .warn { color: #b45309; }
    .err { color: #b91c1c; }
    .ok  { color: #065f46; }
  </style>
</head>
<body>
<noscript style="padding:1rem;color:#b91c1c;">Activez JavaScript pour afficher la carte.</noscript>
<div id="app">
  <header>
    <h1>Extracteur de rues OSM — dessinez ou utilisez la vue courante, exportez en CSV</h1>
  </header>

  <div id="toolbar">
    <div class="group">
      <button id="btn-clear">Effacer la sélection</button>
      <button id="btn-query-poly" class="primary">Rechercher (polygone)</button>
      <button id="btn-query-bbox">Rechercher (BBOX vue courante)</button>
    </div>

    <div class="group">
      <label for="types">Types de voies (regex) :</label>
      <input id="types" size="42"
             value="^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|pedestrian)$" />
    </div>

    <div class="group">
      <label>Serveur Overpass :</label>
      <select id="endpoint">
        <option value="https://overpass.private.coffee/api/interpreter">Private.coffee (prioritaire)</option>
        <option value="https://overpass-api.de/api/interpreter">overpass-api.de</option>
      </select>
    </div>

    <div class="right">
      <span id="search-status" role="status" aria-live="polite" class="badge">Prêt</span>
      <span id="count-unique" class="badge" title="Rues uniques">0 nom unique</span>
      <span id="count-raw" class="badge" title="Segments (ways)">0 tronçon</span>
      <button id="btn-dl-unique" disabled>CSV (noms uniques)</button>
      <button id="btn-dl-raw" disabled>CSV (détails)</button>
    </div>
  </div>

  <div id="map"></div>

  <div id="log">
    <div><strong>Journal</strong> — Dessinez un polygone/rectangle OU utilisez le bouton BBOX (vue courante), puis lancez une recherche.</div>
    <div>Astuce : zoomez au plus près du quartier pour limiter le volume.</div>
    <div id="messages"></div>
    <div id="table-wrap"></div>
  </div>
</div>

<script>
/** Chargeurs multi-CDN (Leaflet + Leaflet.draw) **/
(function(){
  const logEl = document.getElementById('messages');
  function log(msg, cls){ const p=document.createElement('div'); if(cls)p.className=cls; p.textContent=msg; logEl && logEl.prepend(p); }

  function loadCSS(href){
    return new Promise((resolve,reject)=>{
      const l=document.createElement('link'); l.rel='stylesheet'; l.href=href;
      l.onload=()=>resolve(); l.onerror=()=>reject(new Error('CSS fail '+href));
      document.head.appendChild(l);
    });
  }
  function loadJS(src){
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script'); s.src=src; s.defer=true;
      s.onload=()=>resolve(); s.onerror=()=>reject(new Error('JS fail '+src));
      document.head.appendChild(s);
    });
  }
  async function loadFirstWorking(pairs, label){
    let lastErr=null;
    for (const p of pairs){
      try{
        log(`Chargement ${label} : ${new URL(p.js).host}`,'warn');
        await loadCSS(p.css);
        await loadJS(p.js);
        log(`${label} chargé : ${new URL(p.js).host}`,'ok');
        return true;
      }catch(e){ lastErr=e; log(`${label} échec : ${e.message}`,'err'); }
    }
    throw lastErr || new Error(`${label} introuvable`);
  }

  const leafletCDNs = [
    {css:"https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css", js:"https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"},
    {css:"https://unpkg.com/leaflet@1.9.4/dist/leaflet.css",            js:"https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"},
    {css:"https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css", js:"https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"},
  ];
  const drawCDNs = [
    {css:"https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.css", js:"https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"},
    {css:"https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css",            js:"https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"},
    {css:"https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css", js:"https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"},
  ];

  (async function boot(){
    try {
      await loadFirstWorking(leafletCDNs, 'Leaflet');
      await loadFirstWorking(drawCDNs, 'Leaflet.draw');
      initApp();
    } catch(e){
      log('Erreur critique de chargement : '+e.message,'err');
      alert('Erreur de chargement des bibliothèques :\\n'+e.message+'\\nEssayez un autre navigateur ou un autre réseau (certains CDN peuvent être bloqués).');
    }
  })();

  /** Application après chargement des libs **/
  function initApp(){
    const badgeUnique = id('count-unique');
    const searchStatus = id('search-status');
    let searching = false;
    function setSearching(active, message) {
      searching = active;
      id('btn-query-poly').disabled = active;
      id('btn-query-bbox').disabled = active;
      searchStatus.textContent = message || (active ? 'Recherche en cours…' : 'Prêt');
    }
    const badgeRaw    = id('count-raw');
    function setCounts(u, r) {
      badgeUnique.textContent = `${u} ${u>1?'noms uniques':'nom unique'}`;
      badgeRaw.textContent    = `${r} ${r>1?'tronçons':'tronçon'}`;
    }
    function id(x){return document.getElementById(x)}

    // 🔽🔽🔽 Remplace la vieille fonction de download par une version robuste
    function downloadCSV(text, filename){
      // BOM pour Excel + accents
      const csvText = "\uFEFF" + text;
      const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);

      try {
        a.click(); // cas standard (Chrome/Firefox/Safari récents)
      } catch (e) {
        // Fallback : Safari récalcitrant → ouvrir dans un nouvel onglet
        try { window.open(url, '_blank'); } catch(_) {}
      }
      // Laisse un délai avant révocation pour certains navigateurs
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    }
    // 🔼🔼🔼

    function escapeHtml(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
    function log(msg, cls){ const p=document.createElement('div'); if(cls)p.className=cls; p.textContent=msg; logEl.prepend(p); }

    // --- Carte + fallback de tuiles
    const map = L.map('map');
    map.setView([44.657, -1.17], 14);
    const tileProviders = [
      {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',           attr:'&copy; OpenStreetMap contributors'},
      {url:'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',  attr:'&copy; OpenStreetMap, tiles: osmfr'},
      {url:'https://{s}.tile.openstreetmap.de/{z}/{x}/{y}.png',        attr:'&copy; OpenStreetMap, tiles: DE'},
    ];
    let tileIndex = 0;
    let tiles = L.tileLayer(tileProviders[tileIndex].url, {maxZoom:19, attribution: tileProviders[tileIndex].attr}).addTo(map);
    tiles.on('tileerror', ()=>{
      log('Erreur de tuiles. Bascule vers un autre serveur…', 'warn');
      if (tileIndex < tileProviders.length - 1){
        tileIndex++;
        map.removeLayer(tiles);
        tiles = L.tileLayer(tileProviders[tileIndex].url, {maxZoom:19, attribution: tileProviders[tileIndex].attr}).addTo(map);
      } else {
        log('Tous les serveurs de tuiles ont échoué.', 'err');
      }
    });

    map.whenReady(()=>{ log('Carte prête.','ok'); setTimeout(()=>map.invalidateSize(),100); });
    window.addEventListener('resize', ()=> setTimeout(()=>map.invalidateSize(),100));

    // --- Dessin
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);
    const drawControl = new L.Control.Draw({
      draw: { polyline:false, circle:false, marker:false, circlemarker:false,
        polygon:{allowIntersection:false, showArea:true, metric:true},
        rectangle:{showArea:true, metric:true}
      },
      edit: { featureGroup: drawnItems }
    });
    map.addControl(drawControl);
    map.on(L.Draw.Event.CREATED, e => { drawnItems.addLayer(e.layer); log('Forme ajoutée. Vous pouvez l’éditer avant recherche.'); });

    id('btn-clear').addEventListener('click', ()=>{
      drawnItems.clearLayers(); setCounts(0,0);
      id('btn-dl-unique').disabled = id('btn-dl-raw').disabled = true;
      id('table-wrap').innerHTML=''; log('Sélection effacée.');
    });

    // --- Conversions géométriques
    function layerToPolyString(layer){
      const latlngs = layer.getLatLngs();
      const ring = Array.isArray(latlngs[0]) ? latlngs[0] : latlngs;
      const coords = ring.map(ll=>[ll.lat, ll.lng]);
      const first=coords[0], last=coords[coords.length-1];
      if (first[0]!==last[0] || first[1]!==last[1]) coords.push(first);
      return coords.map(([lat,lon])=>`${lat} ${lon}`).join(' ');
    }
    function getLastPolygonPoly(){
      const layers = Object.values(drawnItems._layers);
      if (!layers.length) return null; const layer = layers[layers.length-1];
      if (!('getLatLngs' in layer)) return null; return layerToPolyString(layer);
    }
    function getBbox(){
      const b = map.getBounds();
      return `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
    }

    // --- Overpass: QL + requêtes
    function buildQL({usePoly, polyStr, useBbox, bboxStr}){
      const endpoint = id('endpoint').value;
      const typesRe = (id('types').value || '').trim();
      const typeFilter = typesRe ? `["highway"~"${typesRe}"]` : '["highway"]';
      const loc = usePoly ? `(poly:"${polyStr}")` : useBbox ? `(${bboxStr})` : '';
      const ql = `[
  out:json][timeout:60];
  way${typeFilter}["name"]${loc};
  out tags;`;
      return { endpoint, ql };
    }
    // Serveurs publics : interrogation séquentielle pour éviter de les surcharger.
    async function runOverpass(ql, endpoint, bboxStr = null){
      const servers = [...new Set([
        endpoint,
        'https://overpass.private.coffee/api/interpreter',
        'https://overpass-api.de/api/interpreter'
      ])];
      async function request(query, label) {
        let lastError;
        for (const server of servers) {
          const host = new URL(server).host;
          log(label + ' — serveur ' + host);
          searchStatus.textContent = label + ' — ' + host;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 40000);
          try {
            const res = await fetch(server, {
              method: 'POST',
              mode: 'cors',
              headers: {'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},
              body: new URLSearchParams({data: query}),
              signal: controller.signal
            });
            if (!res.ok) {
              const error = new Error('HTTP ' + res.status);
              error.status = res.status;
              throw error;
            }
            const json = await res.json();
            if (!json || !Array.isArray(json.elements))
              throw new Error('Réponse JSON Overpass invalide');
            log(label + ' — ' + json.elements.length + ' tronçons reçus', 'ok');
            return json;
          } catch (error) {
            lastError = error;
            log(label + ' — ' + host + ' : ' + (error.name === 'AbortError' ? 'délai dépassé' : error.message), 'warn');
            if ([400, 401, 403, 404, 422].includes(error.status)) throw error;
          } finally {
            clearTimeout(timer);
          }
        }
        throw lastError || new Error('Serveurs Overpass indisponibles');
      }

      function splitBbox(bbox) {
        const coords = bbox.split(',').map(Number);
        if (coords.length !== 4 || !coords.every(Number.isFinite)) return null;
        const [south, west, north, east] = coords;
        if (north <= south || east <= west) return null;
        const midLat = (south + north) / 2, midLon = (west + east) / 2;
        return [
          [south, west, midLat, midLon].join(','),
          [south, midLon, midLat, east].join(','),
          [midLat, west, north, midLon].join(','),
          [midLat, midLon, north, east].join(',')
        ];
      }

      const chunks = bboxStr ? splitBbox(bboxStr) : null;
      const coords = bboxStr ? bboxStr.split(',').map(Number) : null;
      const largeArea = chunks && (coords[2] - coords[0] > 0.018 || coords[3] - coords[1] > 0.025);
      if (!largeArea) {
        try {
          return await request(ql, 'Recherche');
        } catch (error) {
          if (!chunks || [400, 401, 403, 404, 422].includes(error.status)) throw error;
          log('Recherche globale indisponible : découpage en quatre secteurs…', 'warn');
        }
      } else {
        log('Zone étendue : recherche en quatre secteurs pour alléger les requêtes.', 'warn');
      }
      if (!chunks) throw new Error('Impossible de découper la zone sélectionnée');
      const collected = new Map();
      for (let i = 0; i < chunks.length; i++) {
        const pieceQL = ql.replace('(' + bboxStr + ')', '(' + chunks[i] + ')');
        if (pieceQL === ql) throw new Error('Impossible de préparer le secteur ' + (i+1));
        const result = await request(pieceQL, 'Secteur ' + (i+1) + '/4');
        for (const element of result.elements) {
          if (element.type === 'way') collected.set(element.id, element);
        }
        // Espacer les requêtes sur les instances publiques.
        if (i < chunks.length - 1) await new Promise(resolve => setTimeout(resolve, 1000));
      }
      log('Quatre secteurs réunis : ' + collected.size + ' tronçons distincts.', 'ok');
      return {elements: [...collected.values()]};
    }

    // Découpe un polygone en sous-polygones limités à chaque secteur.
    // Le filtrage reste géographique : on ne remplace pas le polygone par une BBOX.
    function polygonTiles(polyStr) {
      let ring = polyStr.trim().split(/\s+/).map(Number);
      if (ring.length < 6 || ring.length % 2 || ring.some(x=>!Number.isFinite(x))) return [];
      let points = [];
      for(let i=0;i<ring.length;i+=2) points.push({lat:ring[i],lon:ring[i+1]});
      if(points.length>1 && points[0].lat===points.at(-1).lat && points[0].lon===points.at(-1).lon) points.pop();
      if(points.length<3) return [];
      const lats=points.map(p=>p.lat),lons=points.map(p=>p.lon);
      const south=Math.min(...lats),north=Math.max(...lats),west=Math.min(...lons),east=Math.max(...lons);
      if(north===south || east===west) return [];
      const divisions = (north-south>0.04 || east-west>0.05) ? 4 : 2;
      const clip=(input,axis,bound,keepGreater)=>{
        const output=[];
        const inside=p=>keepGreater ? p[axis]>=bound-1e-10 : p[axis]<=bound+1e-10;
        for(let i=0;i<input.length;i++){
          const current=input[i], previous=input[(i+input.length-1)%input.length];
          const a=inside(previous),b=inside(current);
          if(a!==b){
            const ratio=(bound-previous[axis])/(current[axis]-previous[axis]);
            output.push({lat:previous.lat+ratio*(current.lat-previous.lat),
                         lon:previous.lon+ratio*(current.lon-previous.lon)});
          }
          if(b)output.push(current);
        }
        return output;
      };
      const tiles=[];
      for(let y=0;y<divisions;y++)for(let x=0;x<divisions;x++){
        const s=south+(north-south)*y/divisions,n=south+(north-south)*(y+1)/divisions;
        const w=west+(east-west)*x/divisions,e=west+(east-west)*(x+1)/divisions;
        let part=clip(points,'lat',s,true);
        if(part.length)part=clip(part,'lat',n,false);
        if(part.length)part=clip(part,'lon',w,true);
        if(part.length)part=clip(part,'lon',e,false);
        const cleaned=part.filter((p,i)=>i===0||Math.abs(p.lat-part[i-1].lat)>1e-9||Math.abs(p.lon-part[i-1].lon)>1e-9);
        if(cleaned.length>2){
          const first=cleaned[0],last=cleaned[cleaned.length-1];
          if(Math.abs(first.lat-last.lat)>1e-9||Math.abs(first.lon-last.lon)>1e-9)cleaned.push({...first});
          const str=cleaned.map(p=>p.lat.toFixed(7)+' '+p.lon.toFixed(7)).join(' ');
          tiles.push(str);
        }
      }
      return tiles;
    }

    async function runPolygonOverpass(ql, endpoint, polyStr) {
      const tiles=polygonTiles(polyStr);
      if(!tiles.length) throw new Error('Polygone invalide');
      // Les grands polygones sont divisés immédiatement ; les petits seulement si nécessaire.
      const values=polyStr.trim().split(/\s+/).map(Number);
      const lats=values.filter((_,i)=>i%2===0),lons=values.filter((_,i)=>i%2===1);
      const large=Math.max(...lats)-Math.min(...lats)>0.018 ||
                  Math.max(...lons)-Math.min(...lons)>0.025;
      if(!large){
        try{return await runOverpass(ql,endpoint);}
        catch(e){if([400,401,403,404,422].includes(e.status))throw e;
          log('Nouvelle tentative par secteurs du polygone…','warn');
        }
      }
      log('Polygone découpé en '+tiles.length+' secteurs pour réduire les délais.','warn');
      const all=new Map();
      for(let i=0;i<tiles.length;i++){
        const tileQL=ql.replace('(poly:"'+polyStr+'")','(poly:"'+tiles[i]+'")');
        if(tileQL===ql) throw new Error('Découpage du polygone impossible');
        searchStatus.textContent='Polygone : secteur '+(i+1)+'/'+tiles.length;
        const res=await runOverpass(tileQL,endpoint);
        for(const item of res.elements)if(item.type==='way')all.set(item.id,item);
        log('Polygone : secteur '+(i+1)+'/'+tiles.length+' terminé','ok');
        if(i<tiles.length-1)await new Promise(r=>setTimeout(r,750));
      }
      return {elements:[...all.values()]};
    }

    // --- Rendu & CSV
    let rowsRaw = [], rowsUnique = [];
    function renderTable(rows){
      const wrap = id('table-wrap');
      if (!rows.length){ wrap.innerHTML = '<p>Aucun résultat.</p>'; return; }
      const header = '<tr><th>name</th><th>highway</th><th>@id</th></tr>';
      const trs = rows.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.highway||'')}</td><td>${escapeHtml(r.id)}</td></tr>`).join('');
      wrap.innerHTML = `<table>${header}${trs}</table>`;
    }
    function toCSV(rows, cols){
      const esc = v => '"'+String(v??'').replace(/"/g,'""')+'"';
      const lines = [cols.join(',')];
      for (const r of rows){ lines.push(cols.map(c=>esc(r[c])).join(',')); }
      return lines.join('\n');
    }
    function process(json){
      rowsRaw = (json.elements||[])
        .filter(el=>el.type==='way' && el.tags && el.tags.name)
        .map(el=>({ name: el.tags.name, highway: el.tags.highway||'', id: el.id }));
      const seen = new Set();
      rowsUnique = [];
      for (const r of rowsRaw){ const k=r.name.toLowerCase().trim(); if(!seen.has(k)){ seen.add(k); rowsUnique.push({ name:r.name }); } }
      rowsUnique.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
      setCounts(rowsUnique.length, rowsRaw.length);
      renderTable(rowsRaw);
      searchStatus.textContent = rowsUnique.length
        ? rowsUnique.length + ' noms trouvés'
        : 'Aucune rue trouvée dans cette zone';
      log('Résultat : ' + rowsRaw.length + ' tronçons, ' + rowsUnique.length + ' noms uniques.', rowsRaw.length ? 'ok' : 'warn');
      // (ré)active les boutons si résultats
      id('btn-dl-unique').disabled = rowsUnique.length===0 ? true : false;
      id('btn-dl-raw').disabled    = rowsRaw.length===0    ? true : false;
    }

    // --- Actions
    id('btn-query-poly').addEventListener('click', async ()=>{
      if (searching) return;
      try{
        setSearching(true);
        const poly = getLastPolygonPoly(); if (!poly){ alert('Dessinez d\'abord un polygone ou un rectangle.'); return; }
        id('table-wrap').innerHTML=''; setCounts(0,0); id('btn-dl-unique').disabled = id('btn-dl-raw').disabled = true;
        const {endpoint, ql} = buildQL({usePoly:true, polyStr: poly});
        const json = await runPolygonOverpass(ql, endpoint, poly);
        process(json);
        log('OK (polygone).','ok');
      }catch(err){ console.error(err); searchStatus.textContent='Échec de recherche'; log('Erreur Overpass : '+err.message,'err'); alert('Erreur Overpass\\n'+err.message); }
      finally { setSearching(false, searchStatus.textContent); }
    });
    id('btn-query-bbox').addEventListener('click', async ()=>{
      if (searching) return;
      try{
        setSearching(true);
        const bbox = getBbox();
        id('table-wrap').innerHTML=''; setCounts(0,0); id('btn-dl-unique').disabled = id('btn-dl-raw').disabled = true;
        const {endpoint, ql} = buildQL({useBbox:true, bboxStr: bbox});
        const json = await runOverpass(ql, endpoint, bbox);
        process(json);
        log('OK (bbox vue courante).','ok');
      }catch(err){ console.error(err); searchStatus.textContent='Échec de recherche'; log('Erreur Overpass : '+err.message,'err'); alert('Erreur Overpass\\n'+err.message); }
      finally { setSearching(false, searchStatus.textContent); }
    });

    // ✅ Exports (noms uniques / détails) — avec BOM + fallback Safari
    id('btn-dl-unique').addEventListener('click', ()=>{
      if (!rowsUnique.length) { alert('Aucun résultat à exporter. Lancez d\'abord une recherche.'); return; }
      const csv = toCSV(rowsUnique, ['name']);
      downloadCSV(csv, 'rues_uniques.csv');
      log('CSV (noms uniques) téléchargé.','ok');
    });
    id('btn-dl-raw').addEventListener('click', ()=>{
      if (!rowsRaw.length) { alert('Aucun résultat à exporter. Lancez d\'abord une recherche.'); return; }
      const csv = toCSV(rowsRaw, ['name','highway','id']);
      downloadCSV(csv, 'rues_details.csv');
      log('CSV (détails) téléchargé.','ok');
    });
  }
})();
</script>
</body>
</html>
